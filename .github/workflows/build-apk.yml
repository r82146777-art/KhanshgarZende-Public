name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download full original source
        run: |
          set -e
          python3 << 'PY'
          import urllib.request, re, http.cookiejar
          file_id = '1X85NlV1gn30t-yEhevMfUWFWym7vSFV5'
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')]
          url = f'https://drive.google.com/uc?export=download&id={file_id}'
          resp = opener.open(url, timeout=120)
          data = resp.read()
          if data[:2] == b'PK':
              open('src.zip', 'wb').write(data)
              print('direct', len(data))
          else:
              text = data.decode('utf-8', 'ignore')
              m = re.search(r'name="confirm"\s+value="([^"]+)"', text)
              confirm = m.group(1) if m else 't'
              m2 = re.search(r'name="uuid"\s+value="([^"]+)"', text)
              uuid = m2.group(1) if m2 else ''
              url2 = f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm={confirm}&uuid={uuid}'
              resp2 = opener.open(url2, timeout=300)
              data2 = resp2.read()
              open('src.zip', 'wb').write(data2)
              print('confirmed', len(data2))
              if data2[:2] != b'PK':
                  raise SystemExit('Downloaded file is not a zip')
          PY
          unzip -q src.zip -d fullsrc
          PROJ=$(find fullsrc -name 'settings.gradle.kts' | head -1 | xargs dirname)
          echo "PROJ=$PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Apply v5.7 patches
        run: |
          set -e
          python3 ci/patch_v57.py

      - name: Setup Android SDK
        run: |
          set -e
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" --licenses >/tmp/licenses.txt || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed release APK
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          grep -E '^e: |error:' /tmp/build.log | head -40 || true
          exit $RC

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KhanshgarZende-v5.7-apk
          path: '**/app/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 30
